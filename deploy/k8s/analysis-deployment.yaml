apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-service
  namespace: tellurion
  labels:
    app.kubernetes.io/name: analysis-service
    app.kubernetes.io/part-of: tellurion
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: analysis-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analysis-service
        app.kubernetes.io/part-of: tellurion
    spec:
      containers:
        - name: analysis
          image: tellurion/analysis:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: tellurion-config
          env:
            # AUD-39：名字必须是 DATABASE_PASSWORD —— 代码读的是
            # `database.password`，AutomaticEnv 把它映射成 DATABASE_PASSWORD。
            # 此前注入的是 POSTGRES_PASSWORD（零读取者），于是密码根本到不了
            # 应用手里。
            #
            # REDIS_PASSWORD 已删除：本项目 redis 没有 --requirepass，不校验
            # 密码，那个 env 零读取者（详见 configmap.yaml 的说明）。
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            # QT-71 / 裁-17：analysis 是 service token 的**验证方**之一
            # （worker / analytics 调 POST /api/backtest）。没有这把 secret
            # 就进入 open-access，而它对外发布在集群内，不能裸奔。
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tellurion-jwt
                  key: jwt-secret
            # 出站调 tellurion-risk 的 POST /api/risk/resolve（QT-66 的规则
            # 快照取数）。viper 键 risk_service.resolve_token →
            # RISK_SERVICE_RESOLVE_TOKEN；空值 = 上游未开鉴权（仅回环开发态）。
            - name: RISK_SERVICE_RESOLVE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: service-tokens
                  key: risk-service-resolve-token
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: analysis-service
  namespace: tellurion
  labels:
    app.kubernetes.io/name: analysis-service
    app.kubernetes.io/part-of: tellurion
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: analysis-service
  ports:
    - name: http
      port: 8085
      targetPort: http
