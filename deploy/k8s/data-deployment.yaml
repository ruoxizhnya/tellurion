apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: tellurion
  labels:
    app.kubernetes.io/name: data-service
    app.kubernetes.io/part-of: tellurion
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: data-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-service
        app.kubernetes.io/part-of: tellurion
    spec:
      containers:
        - name: data
          # 镜像由 tellurion-data 仓发布（SVC-CORE-DATA-RETIRE，2026-11-08）：
          # 本仓已无 data 构建目标（Makefile 的 build-data 于 2026-11-11 删除）。
          # 镜像名已跨仓统一（data 仓 8483bca，2026-11-11）：`tellurion/data:${DATA_IMAGE_TAG:-latest}`，
          # 与 docker-compose.yml 同一约定。k8s 清单不做 shell 变量展开，故这里写死
          # 默认 tag `latest`；要换 tag 改这一行，或改用 kustomize/helm 注入。
          image: tellurion/data:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: tellurion-config
          env:
            # AUD-39：名字必须是 DATABASE_PASSWORD（代码读 `database.password`）。
            # 此前注入的是 POSTGRES_PASSWORD —— 零读取者，密码到不了应用手里。
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            # data-service（tellurion-data 仓）只读 DSN，不读 core 旧的那五个
            # DATABASE_* 键。DSN 由上面 configmap 的四个身份字段 + 本条的
            # Secret 密码拼出：k8s 的 $(VAR) 展开只会用**同一容器里先前定义**
            # 的 env，所以这一项必须排在 DATABASE_PASSWORD 之后。
            # 此前这里根本没有 DATABASE_URL —— 镜像起来后没有任何连接串，
            # 数据服务实际拿不到库。schema 落点见 configmap 的 DATA_MARKET_SCHEMA。
            - name: DATABASE_URL
              value: "postgres://$(DATABASE_USER):$(DATABASE_PASSWORD)@$(DATABASE_HOST):$(DATABASE_PORT)/$(DATABASE_DATABASE)?sslmode=disable"
            # 数据源凭证。⚠️ 读取点**不在本仓**：data-service 的镜像由
            # tellurion-data 仓发布（SVC-CORE-DATA-RETIRE，2026-11-08），它的
            # Tushare 传输（X1c）读这个 env。tools/check_deploy_consistency.py
            # 只扫本仓 Go 源码，这类跨仓键因此在 CROSS_REPO_ENV_READERS 里逐条
            # 声明，未声明的仍会按「零读取点」报错。
            - name: TUSHARE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: data-source-credentials
                  key: tushare-token
                  optional: true
            # QT-71 / 裁-17：data-service 也必须验证入站 token —— 否则
            # core / analytics 用 `service` 角色做的服务间调用到这里是裸的，
            # 而 :8081 的写门（ingest、全量同步触发）只在 authz 策略表后面。
            # 与 analysis / risk / analytics 共用同一把 secret。
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tellurion-jwt
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
  namespace: tellurion
  labels:
    app.kubernetes.io/name: data-service
    app.kubernetes.io/part-of: tellurion
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: data-service
  ports:
    - name: http
      port: 8081
      targetPort: http
