apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: tellurion
  labels:
    app.kubernetes.io/name: data-service
    app.kubernetes.io/part-of: tellurion
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: data-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: data-service
        app.kubernetes.io/part-of: tellurion
    spec:
      containers:
        - name: data
          image: tellurion/data:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: tellurion-config
          env:
            # AUD-39：名字必须是 DATABASE_PASSWORD（代码读 `database.password`）。
            # 此前注入的是 POSTGRES_PASSWORD —— 零读取者，密码到不了应用手里。
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            # 数据源凭证。⚠️ 读取点**不在本仓**：data-service 的镜像由
            # tellurion-data 仓发布（SVC-CORE-DATA-RETIRE，2026-11-08），它的
            # Tushare 传输（X1c）读这个 env。tools/check_deploy_consistency.py
            # 只扫本仓 Go 源码，这类跨仓键因此在 CROSS_REPO_ENV_READERS 里逐条
            # 声明，未声明的仍会按「零读取点」报错。
            - name: TUSHARE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: data-source-credentials
                  key: tushare-token
                  optional: true
            # QT-71 / 裁-17：data-service 也必须验证入站 token —— 否则
            # core / analytics 用 `service` 角色做的服务间调用到这里是裸的，
            # 而 :8081 的写门（ingest、全量同步触发）只在 authz 策略表后面。
            # 与 analysis / risk / analytics 共用同一把 secret。
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tellurion-jwt
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
  namespace: tellurion
  labels:
    app.kubernetes.io/name: data-service
    app.kubernetes.io/part-of: tellurion
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: data-service
  ports:
    - name: http
      port: 8081
      targetPort: http
