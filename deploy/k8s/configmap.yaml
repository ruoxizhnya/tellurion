apiVersion: v1
kind: ConfigMap
metadata:
  name: tellurion-config
  namespace: tellurion
  labels:
    app.kubernetes.io/name: tellurion
    app.kubernetes.io/part-of: tellurion
data:
  # 服务发现（P1-8）
  #
  # 服务端口来自各服务自己的 config/*.yaml（`server.port`），不由环境变量
  # 提供 —— 所以这里**不写** ANALYSIS_PORT / DATA_PORT：它们曾长期存在但
  # 从未被读取（死配置，与已删的 AI_PORT 同类，见 P2-7）。改端口要动
  # 对应 deployment 的 containerPort + config/*.yaml 的 server.port。
  #
  # AI_PORT 已移除：cmd/ai 于 2026-09-18 删除（TASKS P2-5），它零调用方
  # 且建在待废弃的 pkg/ai/agents 上。AI 能力走 cmd/analysis 的 MCP 工具层。
  #
  # DATA_SERVICE_URL 是真正会被读取的一项（cmd/analysis/handlers_proxy.go
  # 读 viper 的 `data_service.url`，AutomaticEnv + "."→"_" 替换）。此前
  # k8s 缺这一项，全靠代码里的默认值碰巧能用 —— Service 一旦改名或换端口
  # 就会静默失效。显式写出来，并由 tools/check_deploy_consistency.py
  # 校验它与 docker-compose.yml 里的一致。
  DATA_SERVICE_URL: "http://data-service:8081"
  # ── Database (PostgreSQL) ──────────────────────────────────────────
  # AUD-39：这里的键名必须是**应用读的那一套**（DATABASE_*），不是
  # postgres 官方镜像的那一套（POSTGRES_*）。两个服务都用 viper 的
  # AutomaticEnv + SetEnvKeyReplacer(".", "_")，它把配置键
  # `database.host` 映射成 env 名 **DATABASE_HOST**。此前这里写的是
  # POSTGRES_HOST / POSTGRES_PORT —— 全仓零读取者（postgres 容器也不
  # 需要知道自己的 host/port），于是应用回落到镜像内的 config/*.yaml，
  # 而那份文件的 database.password 是**字面量** `${DATABASE_PASSWORD}`
  # （全仓没有 env 展开器）→ k8s 下 DB 连接必然认证失败。
  #
  # 同一个 configmap 也被 postgres StatefulSet 用 configMapKeyRef 读：
  # 它把 DATABASE_USER / DATABASE_DATABASE 映射到容器认的 POSTGRES_USER /
  # POSTGRES_DB —— **一份词汇表，各自在边界上翻译**，不在这里重复定义
  # 第二个名字（POSTGRES_DB / POSTGRES_USER 已删除）。
  #
  # 值必须与 config/*.yaml、docker-compose.yml 一致（tellurion /
  # postgres）。此前这里是 quantlab / quantlab，而应用读的是
  # tellurion / postgres —— 即使键名修好，库名与用户名仍然对不上。
  # 这条不变量由 tools/check_deploy_consistency.py 的检查 5 守护。
  DATABASE_HOST: "postgres"
  DATABASE_PORT: "5432"
  DATABASE_USER: "postgres"
  DATABASE_DATABASE: "tellurion"
  # ── data-service（tellurion-data 仓发布）的 schema 落点 ───────────────
  # 数据服务不读上面那四个 DATABASE_*，它只读一个 DATABASE_URL（由
  # data-deployment.yaml 用这四个键 + Secret 里的密码拼出来，见那里的注释）。
  # 这一项是它的第二个输入：DDL 落点与读表前缀。X1d 方向是「出厂即 market」，
  # 留空会回落到 public —— 与 market.* 的表全部错开，表现为「表不存在」而不是
  # 配置错误。compose 侧同名键必须与这里同值，由检查器 5e 守。
  DATA_MARKET_SCHEMA: "market"
  # ── Cache (Redis)：2026-11-10 移除 REDIS_URL ──────────────────────
  # SVC-CORE-DATA-RETIRE（2026-11-08）删掉 cmd/data 之后，本仓**没有任何运行时
  # 读取点**再读 `redis.url`（`grep -i redis` 只剩 pkg/storage 的 NewCache 与
  # pkg/marketdata 的 CachedProvider，两者都没有接线方）。按 AUD-39 的规矩
  # 「要么接上读取方，要么删掉」，这里删掉；将来把缓存接回 analysis 时，要连同
  # tools/check_deploy_consistency.py 的 INFRA_ENV_REQUIRED / APP_DB_ENV_KEYS
  # 一起加回来 —— 只加 env 会在下一次检查里被当成死键抓住。
  # 这里从来不该有 Redis 密码：本项目的 redis 是
  # `redis-server --appendonly yes`，**没有 --requirepass**，它根本不校验密码。
  # Logging
  #
  # AUD-35：键名必须是 LOGGING_LEVEL。服务用 viper 的 AutomaticEnv +
  # SetEnvKeyReplacer(".", "_")，它把配置键 `logging.level` 映射成 env 名
  # **LOGGING_LEVEL**（不是 LOG_LEVEL）。此前这里写的是 LOG_LEVEL / LOG_FORMAT
  # —— 全仓零读取点，改了日志级别没有任何效果（死配置，与已删的 GIN_MODE /
  # ANALYSIS_PORT 同类）。
  #
  # LOGGING_FORMAT 于 2026-11-10 一并删除：本仓只读 logging.level，
  # `logging.format` 在 data 面退役后已无任何读取者（数据服务的读取点不在本仓，
  # 见 data-deployment.yaml 里 TUSHARE_TOKEN 的跨仓说明）。
  # （strategy-service 已于 REV-16 删除，本 configmap 只服务 data/analysis。）
  LOGGING_LEVEL: "info"
  # Gin mode
  #
  # 这里**曾经**有 `GIN_MODE: "release"`，已移除（AUD-29）。原因不是它没用 ——
  # 它一直有效，因为 gin 自己在 init() 里读 GIN_MODE（gin/mode.go:52）—— 而是
  # 它给同一个决定开了第二个入口，且是全仓 grep 不到读取点的那个：只有 gin 的
  # 内部实现知道它存在。现在 gin mode 的唯一来源是 config/*.yaml 的
  # server.gin_mode（三个服务都是 "release"），由服务启动时调一次
  # httpserver.ApplyGinMode 应用。config/ 已打进镜像（见各 Dockerfile），
  # 所以 k8s 读到的就是那份文件，行为与移除前一致。
  # 这条不变量由 tools/check_deploy_consistency.py 的检查 4 守护。
