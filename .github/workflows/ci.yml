name: CI

# 项目此前没有任何自动化门禁（见 TASKS P0-2），文档承诺与代码严重脱节。
# 本 workflow 是最小可用门禁：构建 + 静态检查 + 测试 + 文档链接校验。
#
# AUD-12 补齐两处「规范说了但 CI 不查」的缺口：
#   1. Test 步骤加 -race。AGENTS.md §8 规范 1 早已把
#      `go test ./... -count=1 -race` 写成硬性验证标准，CI 却只跑 -count=1，
#      于是数据竞争从未被门禁捕获。
#   2. 新增 frontend job。AGENTS.md §6 的代码规范（shallowRef / any 禁令等）
#      与 §8 的 `npm test` 要求此前全靠自觉。
# 这两项都不是新增要求，只是让执法者与规范对齐。
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tellurion
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # X-DEP-BUMP-CONSUMERS：依赖漏洞门。
      # GO-2026-5004（pgx < v5.9.2）此前没有任何 CI 门能发现 —— pin 里带着已知漏洞也能全绿。
      # govulncheck 按“符号级可达性”判定，只对真正被调用到的漏洞报红；上游模块里的
      # 不可达漏洞只计数不失败（避免把无关 CVE 变成噪声红）。
      # 破坏验证：把 pgx 降回 v5.7.3 ⇒ 本步以 GO-2026-5004 exit 1；还原 v5.11.0 ⇒ EXIT=0。
      #
      # X-CI-BASELINE-PIN（2026-11-13）：版本由 `@latest` 钉成 `@v1.9.0`。
      # `@latest` 让「同一份代码在昨天绿、今天红」只取决于上游发版 —— 也就是
      # 一条没人改过的流水线会自己变色。选 v1.9.0 是施工时 `go list -m -versions
      # golang.org/x/vuln` 确认的当前可用最高版，并在本仓实测 `./...` 全绿
      # （EXIT=0，0 个可达漏洞）。升级版本是**显式动作**：改这里 + 重跑一次。
      # 护栏：internal/repoguard/ci_tool_pin_test.go 会拦回 `@latest`。
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # AUD-38：windows-only 文件在 Linux-only CI 里**从不被编译**。
      #
      # 全仓只有 2 个 `//go:build windows` 文件 —— internal/sandbox/runner/
      # 的 rlimit_windows.go 与 limits_windows_test.go。它们是 Windows 上
      # 唯一能强制资源限额的路径（Job Object，AUD-24），却连一个语法错误都
      # 拦不住：本机的 Windows 是它们**唯一**的编译验证，也就是说这类文件的
      # 首次编译发生在别人的机器上。
      #
      # 用 vet 而不是 build：`go build` **不编译 _test.go**，而 AUD-26 恰恰
      # 就是在这两个测试文件里引入过编译错误、直到在 Windows 上跑才暴露。
      # vet 会连测试文件一起做类型检查，所以它同时覆盖了两者。
      #
      # 交叉编译不需要链接或运行，成本接近零（实测约 20s，与 Linux vet 同量级）。
      - name: Vet (windows)
        run: GOOS=windows go vet ./...

      # AUD-27：补上 gofmt 门禁。AGENTS.md §8 的提交前清单早就写了
      # 「`gofmt -l .` 无输出」，但这条检查在**本机恒失败** —— 本机
      # core.autocrlf=true（PortableGit 的 etc/gitconfig，系统级）会把 checkout
      # 写成 CRLF，于是 `gofmt -l .` 列出全部 412 个 CRLF 的 .go 文件。
      # 一个恒失败的检查项等于没有检查项：真正的 32 个未格式化文件被 CRLF
      # 噪声盖住，没人看见。
      #
      # 修法是加 `.gitattributes`（`* text=auto eol=lf`）。注意仓库 blob
      # **本来就是 LF**（实测 558/558 个 .go 文件零个含 CR），所以那次修正是
      # **零 blob 变化** —— 它只约束 checkout 怎么写。
      #
      # Linux runner 上 checkout 本来就是 LF，所以这一步在 CI 里一直有效；
      # 真正挡住它的是「本机跑不出可信结果，于是没人信它」。
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt 发现未格式化文件（本地用 gofmt -w <file> 修）"
            echo "$unformatted"
            exit 1
          fi

      # 存储层测试需要 Postgres。此前本 job 虽起了 service，却**不设**
      # TEST_DATABASE_DSN、也没有迁移步 ⇒ 所有库侧用例（PIT、迁移账本等）
      # 长期显式 skip，绿是「没验过」的绿（CORE-CI-DB-LEGS-SKIPPED）。
      # 现在分两步对齐本地口径：先由 tools/ci/applymigrations 把一次性库迁到
      # 最新，再在 Test 步骤给出同一个 DSN —— 迁移动作仍只走显式入口
      # （DATA-09 的结构护栏：默认构建的测试不得调用迁移构造）。
      - name: Apply core migrations
        run: go run ./tools/ci/applymigrations
        env:
          TEST_DATABASE_DSN: postgres://postgres:postgres@127.0.0.1:5432/tellurion?sslmode=disable

      # AUD-12：加 -race（需 cgo + gcc，ubuntu-latest 自带）。
      # 开门前先实测过存量：`go test -race ./...` 报 17~18 处数据竞争、16 个
      # 用例失败，全部集中在 cmd/analysis —— 测试助手在 t.Parallel() 下各自
      # 调 gin.SetMode()，而它写的是 gin 的包级全局（ginMode / modeName），
      # 与另一个并行测试注册路由时的 IsDebugging() 读相互竞争。生产代码无涉。
      # 已按 pkg/auth 的既有先例（S7-P0-14 / ODR-043）集中到 TestMain 修掉，
      # 修完 -race 全量绿。
      - name: Test
        # REV-21：加 -coverprofile + 覆盖率门禁。此前 CI 只跑 -race，
        # 「覆盖率往下滑」从来没有红过（TEST.md 自陈「目标不是门禁」）。
        #
        # 门禁执法者是 tools/coveragegate（语句加权，与 go tool cover
        # 的 total 同口径）。阈值 = 2026-11-13 实测基线 - 5pct 余量：
        #   total 72.6% → 67；pkg/backtest 82.4% → 77。
        # 基线口径 = **设 TEST_DATABASE_DSN** 跑全套件，DB 腿不跳过
        # （CORE-CI-DB-LEGS-SKIPPED）。2026-11-13 在隔离 PG 16（迁移后）实测：
        # total 72.6%、pkg/backtest 82.4%（-p 1 串行，避开本地连接数上限）。
        # CORE-COVERAGE-FLOOR（2026-11-13）：旧阈值 52/65 比实测低 20.6 / 17.4
        # 点，成片删测试也拦不住 —— 把 pkg/storage + cmd/analysis + pkg/marketdata
        # 的已覆盖语句全部翻成未覆盖后 total 仍有 59.4%，旧门禁 PASS，新门禁
        # FAIL（「差 7.6 个百分点」）。门禁自此才真的执法。
        # 要动阈值就同笔改这里、Makefile 的 test 目标、AGENTS.md §8 与
        # internal/repoguard/coverage_floor_test.go，并重跑基线。
        #
        # QT-05 B1（2026-10-23）：`-pkg-min=tellurion/pkg/domain=75` 那条腿已删，
        # 与 Makefile 的 `test` 目标是同一份阈值（改就两边一起改）。理由：domain
        # 整包迁到 tellurion-contracts，而 coveragegate 对「点名却不在 profile 里」
        # 的包按 0% fail-closed 判红 —— 本仓的 go test 测不到外部 module 的包，
        # 留着这条腿只能当场红。迁出后实测 total 61.2%（基线 61.9%；搬走的四包
        # 自身是 83.2%），52 的下限余量反而更大，所以当时阈值本身不动
        # （2026-11-13 CORE-COVERAGE-FLOOR 已按新基线抬到 67/77）。
        # 如实登记缺口：那条 75% 门槛随代码迁出后**今天没有承接者**（contracts 仓
        # CI 只跑 `go test ./... -count=1`，无覆盖率下限），已记进 docs/TASKS.md
        # 的 QT-05 core 腿结案段；要补就在 contracts 仓补，不在本仓替别的仓加门禁。
        #
        # 注意：本地工作树若残留 gitignored 的 web/node_modules（前端拆仓
        # 前的旧产物），go 工具链会把它当模块内包walk 到，本地 total 会
        # 略低于 CI 的干净检出——方向保守，不影响门禁有效性。
        run: |
          go test ./... -count=1 -race -coverprofile=coverage.out
          go run ./tools/coveragegate -profile=coverage.out \
            -total-min=67 \
            -pkg-min=tellurion/pkg/backtest=77
        env:
          TUSHARE_TOKEN: ""
          TEST_DATABASE_DSN: postgres://postgres:postgres@127.0.0.1:5432/tellurion?sslmode=disable

      # CORE-INTEGRATION-TAG-CI（2026-11-13）：`//go:build integration` 的用例
      # 此前**零执行** —— 默认 `go test ./...` 不带 tag，本 workflow 也不带，于是
      # 它们既不在绿里也不在红里。本步与上面的 DB 腿共用同一 postgres service 与
      # 迁移结果，覆盖两个带 tag 的包：
      #   - ./pkg/storage/...：dockertest 自起一次性 postgres:16-alpine（GitHub
      #     runner 带 Docker），真库腿 = 迁移重放守卫、告警 outbox、结果保留、
      #     运行溯源；
      #   - ./pkg/backtest/...：QT-64 Router 接线腿，走 TEST_DATABASE_DSN 指向
      #     本 job 已迁移的 service 库（ohlcv_minute 由迁移创建）。
      #
      # 先 `go vet -tags=integration ./...`：保证**所有**带 tag 的包都能编译
      # （新增 tag 文件不会因为没人跑而烂在树里）；再跑上面两个包。
      #
      # 两处 fail-loud（对应 CORE-INTEGRATION-TAG-CI ②「不得默默 skip」）：
      #   1. 检测不到 Docker ⇒ 红。GH runner 一定有 Docker，缺了是环境回归，
      #      不能把「整套 storage 腿全 skip」当成绿；
      #   2. `--- PASS:` 行数为 0 ⇒ 红。防止「腿跑了、其实一条用例都没执行」。
      # 其余 skip 必须由用例自己打印原因（pkg/storage TestMain 会点名 Docker
      # socket 与跑法；pkg/backtest 走 testenv 的 DSN 契约：未设置显式跳过、
      # 设置但连不上 fail-loud）。
      - name: Integration tag tests
        run: |
          set -o pipefail
          go vet -tags=integration ./...
          go test -tags=integration ./pkg/storage/... ./pkg/backtest/... -count=1 -v 2>&1 | tee /tmp/integration.log
          if grep -q 'SKIP: integration tests require Docker' /tmp/integration.log; then
            echo "::error::integration 腿检测不到 Docker —— CI runner 应自带 Docker，缺了是环境回归，不能按 skip 放行"
            exit 1
          fi
          passed="$(grep -c '^--- PASS:' /tmp/integration.log || true)"
          echo "integration tests PASS lines: ${passed}"
          if [ "${passed}" -lt 1 ]; then
            echo "::error::integration 腿里 0 条 --- PASS —— 用例全被 skip 或根本没跑到"
            exit 1
          fi
        env:
          TUSHARE_TOKEN: ""
          TEST_DATABASE_DSN: postgres://postgres:postgres@127.0.0.1:5432/tellurion?sslmode=disable

      # QT-61：把「默认跳过、且需要外部数据的用例面」在 CI 汇总里点名，让「绿」里
      # 看不见的覆盖缺口变成一条可见的 notice —— 不是把它们变红（那是噪声），也不是
      # 静默忽略（那会永久掩盖缺口）。这两条用例原先连 CI 空 postgres service 直接红。
      - name: Report universe suite not covered (QT-61)
        run: |
          if [ "${TEST_UNIVERSE:-}" != "1" ]; then
            echo "::notice title=QT-61 未覆盖面::pkg/backtest 的 csi300 universe 展开 + 破坏验证（TestResolveStockPool_UniverseCsi300Expands / _FailsLoudWhenConstituentsEmpty）默认跳过：需真库灌 csi300 成分快照（2024-10-31~2026-09-30）。设 TEST_UNIVERSE=1 指向已灌库即可真正执行。"
          fi

      # QT-09 ③：契约一致性 —— 同一组语料喂给 core 与 agent 两侧实现，任一侧语义
      # 漂移即红。语料唯一真相在 contracts 仓的 conformance/cases.json（本仓不复制、
      # 不改写）。core 侧测试的语料定位顺序是 go list -m → GOROOT/bin/go → 逐级向上
      # 找同级 tellurion-contracts；CI 只有 core checkout，所以先把 contracts 匿名
      # clone 成**同级工作树**（public 仓，与 agent-compat job 同款手法）。
      # agent 侧不在本 job 的 checkout 里 ⇒ 脚本打印 [skip] + ::warning，摘要写
      # 「1 侧跳过」，**不算通过**；两仓齐的机器上跑才是完整比对。
      - name: Checkout contracts repo (anonymous https)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          rm -rf ../tellurion-contracts
          git clone --quiet --depth 1 --single-branch --branch main \
            https://github.com/ruoxizhnya/tellurion-contracts ../tellurion-contracts

      - name: Contract conformance (QT-09 ③)
        run: python3 tools/check_contract_conformance.py

  # ── CORE-CI-IMAGE-GATE / ODR-072：镜像构建门 ─────────────────────────
  # 本仓 CI 此前**从不构建镜像**（grep docker/buildx 零命中），于是「compose
  # 里声明的镜像到底出不出得来」没有任何判定者。Dockerfile.service 已经两次
  # 静默坏在 `go build ./cmd/xxx` 上（ODR-021 删 cmd/risk、cmd/execution；
  # AUD-33 删 cmd/analysis/static 的 COPY），症状都不是构建报错，而是
  # **某个服务从来没起来过**。
  #
  # 静态半边在 docs job：tools/check_deploy_consistency.py 检查 compose 的
  # build context / dockerfile 存在、Dockerfile 的 `go build ./cmd/xxx` 目标
  # 目录存在、COPY 源路径存在。它可以每天在本地四条门禁里跑，但它读不懂 go
  # toolchain 的包解析结果 —— 只有真 build 才证明镜像可用。
  #
  # 这里补动态半边：真构建、不 push、单平台（本机可验证的形态）。破坏验证：
  # 把 Dockerfile.service 的 `./cmd/analysis` 改成不存在的目录 ⇒ 本步红。
  image-build:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 一次构建覆盖 Dockerfile.service 里全部三个二进制
      # （analysis-service / worker / dualrun）—— 任一条构建行指向已删目录
      # 都会在这一步炸，而不是等某天有人手动 docker build。
      - name: Build Dockerfile.service
        run: docker build --pull -f Dockerfile.service -t tellurion-core:ci .

  # frontend job 已随前端拆仓移除（2026-10-09，web/ → tellurion-ui）。
  # 前端 lint / typecheck / test 的 CI 现在由 tellurion-ui 仓自己的
  # workflow 承担（见该仓 .github/workflows/ci.yml）。

  # ── K16 ① Python 侧车测试 + 双跑对齐门禁 ──────────────────────────
  # 台账 K16 ③-1「对齐回归测试进 CI 门禁（Go + Python，双跑 diff 超阈即红）」。
  # 两条腿分开跑：py 侧（63 测试）不依赖任何外部服务；align-gate 才拉起
  # PG + 侧车跑真双跑。阈值表的执法者是 cmd/dualrun/gate.go（K15 实测容差
  # 的唯一 Go 实现），CI 只负责把环境搭起来喂给它。
  python:
    name: NT sidecar tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: nt-sidecar/requirements.txt

      - name: Install sidecar deps
        run: pip install -r nt-sidecar/requirements.txt

      # 与本机跑法同参：-B + PYTHONDONTWRITEBYTECODE=1（不落 __pycache__，
      # 避免 .pyc 时间戳漂移引起假绿/假红），从 nt-sidecar/ 根跑 discover。
      - name: Run sidecar tests
        working-directory: nt-sidecar
        run: python -B -m unittest discover -s tests -t .
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      # QT-61：`python` 任务刻意不依赖外部服务（无 PG），无法 materialize nt-sidecar/catalog，
      # 故 fills 报告端到端腿在缺该生成物时显式 skip。这里把「跳过的是哪条、为什么」在 CI 汇总
      # 点名 —— 缺口可见，不是静默忽略（QT-61 §④ 不许静默 skip / 不许 continue-on-error）。
      # 注：align-gate 任务自己会 export catalog 并跑真双跑，这条腿在有 catalog 的环境照常执行。
      - name: Report catalog-dependent suite skipped (QT-61)
        if: always()
        run: |
          if [ ! -d nt-sidecar/catalog ]; then
            echo "::notice title=QT-61 未覆盖面::nt-sidecar 的 fills 报告端到端腿（tests.test_k15r1_fees.FillReportFeeRegressionTest）因 catalog 生成物缺失而显式跳过；纯费率数学仍由同文件 test_fee_model_* 覆盖。跑 export_bars.py --out nt-sidecar/catalog 后自动恢复。"
          fi

  align-gate:
    name: Dual-run alignment gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tellurion
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: nt-sidecar/requirements.txt

      - name: Install sidecar deps
        run: pip install -r nt-sidecar/requirements.txt

      # CI 没有 390 万行真库（也不该有）——合成 fixture 保留 4 位小数价，
      # 让 K15 归因①的「PG 浮点 vs catalog tick」精度差真实复现。
      - name: Seed synthetic alignment fixture
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d tellurion -v ON_ERROR_STOP=1 -f tools/ci/seed_alignment_fixture.sql

      - name: Export fixture catalog
        run: python nt-sidecar/tools/export_bars.py --symbols 000001.SZ,600000.SH --start 2024-01-02 --end 2024-12-31 --out nt-sidecar/catalog
        env:
          NT_PG_DSN: postgres://postgres:postgres@127.0.0.1:5432/tellurion?sslmode=disable

      - name: Start sidecar
        # 坑：本步 working-directory=nt-sidecar，若照抄 export 步的相对路径
        # `--catalog nt-sidecar/catalog` 会被解析成 nt-sidecar/nt-sidecar/catalog（双段）。
        # 用 $GITHUB_WORKSPACE 绝对路径，与 cwd 无关，也和上面那步的 --out 对齐。
        run: python -m sidecar --host 127.0.0.1 --port 9100 --catalog "$GITHUB_WORKSPACE/nt-sidecar/catalog" &
        working-directory: nt-sidecar

      - name: Wait for sidecar healthz
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9100/healthz >/dev/null 2>&1; then
              echo "sidecar ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::sidecar /healthz never became ready"
          exit 1

      # 双跑 ×2 计划（bh / quarterly）+ 确定性腿（两侧各跑两遍）+
      # 阈值判定全在 -gate 里：超阈 / 破坏确定性 / 成交 mismatch → exit 2 红。
      # 报告落盘上传，失败时看证据不是看退出码。
      - name: Dual-run gate (bh)
        run: go run ./cmd/dualrun -strategy bh -gate -out /tmp/dualrun-bh.md

      - name: Dual-run gate (quarterly)
        run: go run ./cmd/dualrun -strategy quarterly -gate -out /tmp/dualrun-quarterly.md

      - name: Upload dual-run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dualrun-reports
          path: /tmp/dualrun-*.md
          if-no-files-found: ignore

  docs:
    name: Doc link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 文档治理规则 R5：文档必须可被自动验证。
      # 常青层 + 活跃层：坏链即失败。
      - name: Check internal doc links
        run: python tools/check_doc_links.py

      # AUD-14：归档层也要查。ODR 与审计报告几乎全在 docs/archive/，而那里
      # 恰恰是**相对层级最深、改名最频繁**的地方 —— 只查活跃层等于把元检查的
      # 盲区放在最需要它的区域（ODR-065 报告归档时层级没同步，2 条死链就是这么
      # 躺进去的）。代码块/行内代码里的链接是**引文**不是导航，检查器会跳过。
      - name: Check internal doc links (incl. archive)
        run: python tools/check_doc_links.py --include-archive

      # 部署一致性：唯一编排是 docker-compose.yml（k8s 已于 CORE-K8S-EXIT 退役，
      # 活跃层出现清单即红），另有 env 口径 / 死键 / Dockerfile 构建面等静态断言。
      - name: Check deploy consistency
        run: python tools/check_deploy_consistency.py

      # QT-08：十二仓自治自检（R1~R6）的汇总入口。CI 上只有 core 被 checkout，
      # 其余兄弟仓缺席 ⇒ 脚本会核 core 自身（R1 无仓外 replace、R2 有 CI+测试、R3 缺口登记）
      # 并显式列出「未在机器上 checkout」的仓；**全 12 仓的完整汇总在兄弟仓齐的机器上跑**
      # （`python tools/check_repo_autonomy.py`）。它红了 = core 自己的自治不变量被破，或
      # 某已知缺口的台账登记号消失了。
      # 先跑 --self-test：这条 job 是 R1~R6 的唯一执法者，没人核它 —— 自证腿（漏检块形式
      # replace、误伤合规本机 go.work 都会红）必须先绿，才轮到它对全仓下结论。
      - name: Repo autonomy self-check (R1~R6)
        run: |
          python tools/check_repo_autonomy.py --self-test
          python tools/check_repo_autonomy.py

      # QT-09 ① / QT-07 ⑤：契约 pin 祖先校验（补 R5 的缺口）。
      # R5（check_repo_autonomy.py）只比对 AGENTS 里的版本声明是否一致；这里核
      # **go.mod 里的实际 pin 是不是目标仓 main 的祖先** —— 伪版本可以指向未评审
      # 的旁支，go build 发现不了。core-only checkout 下若真有 pin，脚本会匿名
      # clone contracts/kit（两仓 public）；core 自 QT-05 B1 起已 pin contracts ⇒
      # 本步会匿名 clone 一次（无 pin 的仓显式打印 0 pin）；S2 切 tag 后自动核 tag。
      # 先跑 --self-test：先证明护栏拦得住旁支 pin/tag/replace，再让它对真仓下结论。
      - name: Contract pin ancestry (R5)
        run: |
          python tools/check_contract_pin.py --self-test
          python tools/check_contract_pin.py

  # ── QT-18：过渡期 core↔agent 编译连体护栏 ──────────────────────────
  # S0~S3 期间 agent 编译期依赖 core 源码，而 W0/W1 的改动**全是 breaking**（abi v2 换
  # host 函数、错误分级改 getSignals 返回、per-run 实例改 Registry.Get 语义、检查点主键变更）。
  # 本 job 在 core 的 PR 上拿当前 core checkout 去编一遍 agent，让「core 绿、agent 静默烂」
  # **当场红**，而不是两周后有人打开 agent 仓才发现它已经烂了。只管编译（build/vet），
  # 不跑 agent 单测（那些要 core 二进制/DB，成本不成比例，也不是本护栏职责；行为兼容属 QT-09）。
  # 判据：单次 ≤5 分钟（build-only）。
  agent-compat:
    name: agent-compat (core→agent 编译护栏)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4                       # core 进 workspace 根

      # tellurion-agent 是 public 仓 ⇒ **匿名读即可**，不需要 secrets.AGENT_REPO_TOKEN，
      # 也因此不再需要「未配 PAT 就 skip + 报 notice」的降级分支（那条分支的绿从来不代表
      # 跨仓编译门跑过 —— 见 docs/TASKS.md QT-18 的降级空跑登记）。
      #
      # 机制订正（2026-10-21，run 39633866772 实测）：上一版写的 `token: ''` **不成立** ——
      # actions/checkout@v4 把空串判成「未提供输入」，步直接红：`Input required and not
      # supplied: token`。匿名能力本身是真的（本机 `git -c credential.helper= ls-remote`
      # 与 `git clone --depth 1` 对 public 仓均退出 0），所以这里不绕 actions 的 token
      # 语义，直接 plain `git clone`。若 agent 仓将来转私有，本步当场 fail-loud ——
      # 届时配只读 fine-grained PAT 并把 token 指回来，**不要**退回「跳过 + 假绿」。
      - name: Checkout agent repo (anonymous https)
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          rm -rf agent
          git clone --quiet --depth 1 --single-branch --branch main \
            https://github.com/ruoxizhnya/tellurion-agent agent
          echo "agent HEAD = $(git -C agent rev-parse --short HEAD) @ $(git -C agent log -1 --format=%s | cut -c1-60)"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
          cache: true

      # 把 agent 的 `replace tellurion` 指到本 runner 上 checkout 的 core（含本次 PR 的改动），
      # 再 build+vet —— 编译逻辑走 tools/ci/agent_compat.sh，与本地降级路径**同一份**
      # （两处各写一边迟早漂移）。有意 breaking（如 abi v2 / QT-01）走**文件化** known-break 白名单：
      # .github/agent-compat-known-break 存在且非空时把红降级成 warning 并打印其内容 —— 那是
      # 一道进仓、reviewer 看得见的人在环签核（须与 agent 适配 PR 同批），**不是 continue-on-error
      # 那种无视成败的掩盖**；白名单留置期间不得静默合入无适配的破坏。文件不存在即严格红。
      - name: Build + vet agent against this core
        env:
          AGENT_REPO: ${{ github.workspace }}/agent
        run: |
          # 脚本自带红/绿结论与 ::error:: 报文；本步只往上叠 CI 专属的白名单政策。
          if sh "$GITHUB_WORKSPACE/tools/ci/agent_compat.sh"; then
            exit 0
          elif [ -s "$GITHUB_WORKSPACE/.github/agent-compat-known-break" ]; then
            echo "::warning title=QT-18 known-break 白名单命中::agent 编译失败，但 .github/agent-compat-known-break 非空 ⇒ 按登记放行；必须附 agent 侧适配 PR。合入后尽快清除该文件。"
            sed 's/^/  known-break: /' "$GITHUB_WORKSPACE/.github/agent-compat-known-break"
          else
            exit 1
          fi
