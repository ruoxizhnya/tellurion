# 本地统一部署形态（2026-11-11 定案；撤销 QT-79 / D-DEPLOY-1 = A）───────
#
# **全工作区本地只留这一个 compose。** 数据库与缓存仍用宿主机原生安装，应用
# 服务用容器。原 docker-compose.services.yml / .e2e.yml / .nt.yaml 三份已并入
# 本文件，差异改由 profile 与 env 表达；跨仓的 7 份 deploy/compose.yaml 是
# **各仓自证资产**（验各自 Dockerfile / health），不属于本地统一栈，也不参与
# 联调 —— 联调一律用本文件的 profile。
#
#   profile 划分
#     默认（无 profile）  data-service:8081 / broker:8091 /
#                         analysis-service:8085 / ai-service:8086
#     full                risk:8089 / strategy:8090 / analytics:8087 /
#                         orchestration:8088（补齐分析 / 风控 / 编排面）
#     orchestration-worker worker（无监听；编排不可达时 fail-closed 退出）
#     tools               dualrun（一次性验收门）
#     nt                  nt-sidecar（可选旁路样本，host 网络）
#
#   docker compose up -d                 # 默认四服务，开箱即起（broker 是 mock）
#   docker compose --profile full up -d  # 再加 risk / strategy / analytics / orchestration
#   RATE_LIMIT_PER_MINUTE=100000 docker compose up -d --force-recreate \
#       --no-deps analysis-service data-service
#                                        # e2e 限流姿势（原 e2e 覆盖层）
#
# ⚠️ **交易通道是 mock，订单永不触达真实柜台。** 默认栈的 broker 以
# `-account-id mock` 起；analysis 侧用 BROKER_CHANNEL=mock +
# BROKER_ALLOW_MOCK=true **双键**确认，装配期还会 GET 对端 `/version` 并要求它
# 自报 mock（pkg/brokerhttp.verifyPeerChannel）。要接真实柜台必须**显式**把
# BROKER_CHANNEL 改成 live（同时清掉 BROKER_ALLOW_MOCK），且对端 `/version`
# 必须自报 live；任一条不满足，analysis-service 在装配期直接拒起 ——
# 没有"降级为 mock"这种中间态，也不许在文档里写成"建议"。
#
#   宿主机原生
#     PostgreSQL 16.15  127.0.0.1:5432   —— 本机在跑的是 Windows 服务
#                                          postgresql-x64-16（data\PG_VERSION=16）；
#                                          无 TimescaleDB（只是 Warn，已实测可建表）。
#                                          ⚠️ tools/local-infra.sh 默认指向
#                                          .workbuddy/binaries/postgres（17.5，当前
#                                          未运行）；两者抢 5432，不能同时起
#     Redis 7.4.11      127.0.0.1:6379   —— 无 requirepass；⚠️ 本仓自 2026-11-12
#                                          `CORE-REDIS-EXIT` 起**零读取点**
#                                          （go-redis 依赖与三处死代码已删），
#                                          宿主 Redis 可停用，本栈不依赖它
#
#   Docker 容器（本文件）
#     data-service     :8081   多源数据接入
#     broker           :8091   执行网关（mock 通道，ADR-036 G0）
#     analysis-service :8085   回测 + 风控 + 执行 + 鉴权（ODR-021 合并后）
#     ai-service       :8086   AI 服务（独立仓 tellurion-agent）
#     risk             :8089   profile full
#     strategy         :8090   profile full
#     analytics        :8087   profile full
#     orchestration    :8088   profile full
#   strategy-service :8082 于 REV-16 删除（ADR-012 关闭，standby 无占位价值）
#   （web :8080 前端已拆仓 → tellurion-ui，2026-10-09）
#
# **为什么把数据库挪出容器**：Docker Desktop 在本机受沙箱限制（启动时会拉起
# wsl.exe 而在程序黑名单里，且起来之后还会自发退出），把最该稳的一层挂在最不稳
# 的一层上不划算。原生 PG 出问题只看一个进程的日志。
#
# ⚠️ **容器内访问宿主机必须用 host.docker.internal，不是 localhost** ——
# 容器里的 localhost 指容器自己。实测（2026-09-25）Docker Desktop 默认就把
# 这个名字解析成 IPv4 192.168.65.254 并且能连到宿主机回环上的服务。
#
# ⚠️ **不要加 `extra_hosts: ["host.docker.internal:host-gateway"]`** ——
# 实测在 Docker Desktop 上加了之后它从 IPv4 变成 IPv6（fdc4:f303:9324::254），
# 是地址族层面的行为改变，而 Desktop 本来就不需要这行。Linux 上才需要它；
# 换到 Linux 跑时再按需加，不要预先写死（本文件以本机能验证的形态为准）。
#
# ⚠️ **服务之间仍用 compose 服务名**（http://data-service:8081）—— 服务全在
# 容器里，这一层没有变，不要改成 localhost。
#
# 端口绑定约定（AUD-13 的推广，2026-09-25）：**本栈里没有任何东西绑 0.0.0.0
# 在宿主机上**。数据库那半由原生进程的配置承担（postgresql.conf 的
# listen_addresses，真身由 tools/local-infra.sh 的 netstat 断言守着）；
# 应用服务这半由本文件的 ports 映射承担 —— 八条映射**全部**带
# 127.0.0.1: 前缀。
#
# 为什么应用端口也必须回环：容器**必须**绑 0.0.0.0 才能被发布端口转发 ——
# 「对外可达性」这件事从绑定地址转移到了发布层。若映射写成 "8085:8085"，
# 等于把读面（以及显式声明放开时的写面）开给整个局域网。
#
# ⚠️ 应用层的三态启动闸（pkg/bootstrap.DecideAuthStartup）**不看绑定地址**：
# 容器绑 0.0.0.0 是常态，第 3 态（无 secret + 显式声明）在任何绑定下都允许
# 启动，风险只由启动 WARN 披露（写面 / 角色校验无鉴权 + 绑定地址）。所以
# 「不可从其他主机到达」这条不变量完全由**发布层**承担，本栈策略是
# 「AUTH_INSECURE 为真 ⟺ 所有映射都回环」（发布约定，不是启动闸判据），
# 由两处机器校验守住，不靠记得：
#   静态 —— tools/check_deploy_consistency.py 的检查 3c（双向：非回环映射
#           必须配 JWT_SECRET；AUTH_INSECURE 为真则每条映射都必须回环）
#   运行时 —— tools/local-stack.sh 读宿主机 netstat，断言
#           8081/8085/8086/8091 只监听回环（full 的四个端口由静态检查覆盖）
#
# tools/check_deploy_consistency.py 的检查 3 已随之改写为「宿主机监听地址」的
# 等价断言 + 破坏验证。
#
# 启动顺序：analysis-service 连不上 PG 会直接 Fatal 退出、**没有重试**；此前靠
# `depends_on + service_healthy` 保证，postgres 不再是 compose 成员后改由镜像内的
# deploy/wait-for-deps.sh 承担 —— **是替换不是删除**，等的是宿主机真实端口。
# 2026-11-11 起它同时等 `BROKER_URL` 的 host:port（broker 未起来就装配必然失败，
# 不让默认栈靠重启碰运气）。data-service 不用这个脚本：它的连接池是惰性的
# （store.Open 不拨号，DDL 失败后台重试），且镜像由数据仓发布、不含本仓脚本。
#
# 注：ai-service 仍在（源码 tellurion-agent，入口 :8086）。旧注释"2026-09-18
# 已删除"与本文件的服务定义矛盾，2026-11-11 按事实纠正。

services:
  # ── broker :8091（执行网关，ADR-036 G0；从 docker-compose.services.yml 并入）──
  # analysis 装配期无条件构造执行通道（cmd/analysis/kernel_wiring.go 的
  # BuildExecutionTrader），所以 broker 必须在默认栈里 —— 否则 `docker compose up`
  # 的默认结果就是 analysis-service 拒起，那不是"预期行为"，是坏的默认值。
  # image 由 ../tellurion-broker 构建；`-account-id mock` + `BROKER_CHANNEL=mock`
  # + `BROKER_ALLOW_MOCK=true` 三处一致，订单永不触达真实柜台。
  # 写侧 token：broker 未设 BROKER_SERVICE_TOKEN 时写端点关闭（503
  # writes_disabled，不是不校验）。本地 mock 栈两边注入同一个 dev 值，
  # 让「下单→记账→查询」整条链能跑通；真实柜台必须换成正式签发的 token。
  broker:
    build:
      context: ../tellurion-broker
      dockerfile: Dockerfile
    image: tellurion-broker:dev
    command: ["-addr", "0.0.0.0:8091", "-account-id", "mock", "-cash", "100000000"]
    ports:
      - "127.0.0.1:8091:8091"
    environment:
      BROKER_SERVICE_TOKEN: ${BROKER_SERVICE_TOKEN:-dev-only-mock-token}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 5
    restart: unless-stopped

  data-service:
    # 镜像由 tellurion-data 仓发布（SVC-CORE-DATA-RETIRE，2026-11-08）。本地开发
    # 用 --build 现建；本仓 Dockerfile.service 已不再产出 /app/data-service，
    # 不能再拿它当 data-service 的构建源。
    image: tellurion/data:${DATA_IMAGE_TAG:-latest}
    build:
      context: ../tellurion-data
      dockerfile: Dockerfile
    ports:
      # 只发布到宿主机回环（见文件头「端口绑定约定」）
      - "127.0.0.1:8081:8081"
    environment:
      # 数据服务只读 DSN（不是 core 旧 viper 的 DATABASE_HOST/PORT/USER/DATABASE 四键）。
      # 容器内视角：宿主机 PG 走 host.docker.internal（容器里的 localhost 是容器自己）。
      DATABASE_URL: postgres://postgres:${DATABASE_PASSWORD:-postgres}@host.docker.internal:5432/${DATABASE_NAME:-tellurion}?sslmode=disable
      # 目标 schema（X1d 方向，出厂即 market）：数据仓据此定 DDL 落点与读表前缀。
      DATA_MARKET_SCHEMA: market
      TUSHARE_TOKEN: ${TUSHARE_TOKEN}
      # QT-71 / 裁-17：data-service 也是 service token 的验证方（analytics 调
      # GET /datasets/*）。空值 = 回环发布下的本地 open-access。
      JWT_SECRET: ${JWT_SECRET:-}
      # 与其余七个服务同构：容器必须绑 0.0.0.0，无 secret 时**显式声明**
      # 「只发布到回环」才放行（取值逐字匹配，拼错即拒起）。映射已带
      # 127.0.0.1: 前缀，声明与事实一致。
      AUTH_INSECURE_EXPOSURE: ${AUTH_INSECURE_EXPOSURE:-loopback-published}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  analysis-service:
    build:
      context: .
      dockerfile: Dockerfile.service
    entrypoint: ["/bin/sh", "/app/wait-for-deps.sh"]
    command: ["/app/analysis-service"]
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      # DB_PASSWORD 已删除（零读取者，viper 读的是 database.password →
      # DATABASE_PASSWORD，见 data-service 的说明）。
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      # ── SVC-ORCH-G3：异步任务面切到编排服务 ─────────────────────────
      # 设置了 ORCHESTRATION_URL 时，POST /api/backtest 的异步分支提交给编排
      # 服务（core 不再新增 backtest_jobs）；未设置 = 维持本地旧路径。
      # 编排服务在 `full` profile（compose 服务名 orchestration:8088）。默认留空
      # 是为了不让 core 因编排缺席而拒起；联调时先 `--profile full up`，再设
      # ORCHESTRATION_URL=http://orchestration:8088。
      ORCHESTRATION_URL: ${ORCHESTRATION_URL:-}
      ORCHESTRATION_SERVICE_TOKEN: ${ORCHESTRATION_SERVICE_TOKEN:-}
      # ── 鉴权三态（P0-4 / ADR-026，2026-11-12 修正第 3 态判据）─────────────
      #
      # 1. 有 JWT_SECRET（env 注入）→ 全闸：写端点要 token + 角色。
      # 2. 无 secret + 无显式声明 + 回环绑定 → 进程照常起，但写面 / 受保护
      #    端点一律 503 auth_unavailable，读端点保持公开。
      # 3. 无 secret + **显式声明** → 放开，**绑定地址不限**（容器必须绑
      #    0.0.0.0）。声明二选一：AUTH_INSECURE=true 或
      #    AUTH_INSECURE_EXPOSURE=loopback-published。启动日志以 WARN 写出
      #    「写面与角色校验无鉴权」+ 绑定地址，非回环时点名「已对外暴露」。
      # 4. 无 secret + 无显式声明 + 非回环绑定 → 拒绝启动（fail closed）。
      #
      # 容器（绑 0.0.0.0）没有第 2 态：要么显式声明进第 3 态，要么配
      # JWT_SECRET，否则拒启。本栈默认就是第 3 态（下面两个默认值都是显式
      # 声明）；「不暴露到局域网」由 ports 的 127.0.0.1: 前缀 + 检查 3c +
      # local-stack.sh 的 netstat 断言守住 —— 那是**发布层**的保证。
      #
      # ⚠️ 整套 playwright / e2e 依赖 open-access；要验第 2 态（写面 503）
      # 只能宿主机直跑并绑 127.0.0.1，容器形态下不可得。
      AUTH_INSECURE: ${AUTH_INSECURE:-true}
      AUTH_INSECURE_EXPOSURE: ${AUTH_INSECURE_EXPOSURE:-loopback-published}
      # 设了密钥则**密钥优先于 AUTH_INSECURE**（DecideAuthStartup 先看密钥）
      # —— 所以 .env 里别同时留着一个值。
      JWT_SECRET: ${JWT_SECRET:-}
      # 跨源白名单，逗号分隔。留空 = 不回显任何 ACAO（默认，最安全）。
      SERVER_CORS_ALLOWED_ORIGINS: ${SERVER_CORS_ALLOWED_ORIGINS:-}
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_DATABASE: ${DATABASE_NAME:-tellurion}
      # 本仓无 Redis 依赖（2026-11-12 CORE-REDIS-EXIT 已删 go-redis 与读取点）。
      DATA_SERVICE_URL: http://data-service:8081
      # STRATEGY_SERVICE_URL 已随 OBS-11（2026-10-09）删除：策略服务 standby
      # （ADR-012），per-day HTTP 信号 fallback 不复存在。
      #
      # AI_SERVICE_URL —— 反代目标（cmd/analysis/handlers_ai_proxy.go 的
      # ai_service.url）。**这里必须是 compose 服务名而不是 localhost**：
      # 缺省值 http://localhost:8086 在宿主机直跑（go run）时恰好命中，
      # 所以在容器形态下一直静默失效 —— copilot / pipeline / explore / tools
      # 四族全部 503「ai-service unreachable」，而 ai-service 自己健康得很。
      # 2026-10-14 拉起本地栈时实测到这条，补上。
      AI_SERVICE_URL: http://ai-service:8086
      # 资产服务（tellurion-strategy，:8090）在 `full` profile 里，默认栈不起它。
      # yaml 默认是宿主机视角 http://localhost:8090；容器里 localhost 是它
      # 自己，所以缺省指向宿主网关（与 DATABASE_HOST 同一约定）。开了 full
      # 可改 http://strategy:8090。
      STRATEGY_ASSET_RESOLVE_URL: ${STRATEGY_ASSET_RESOLVE_URL:-http://host.docker.internal:8090}
      # P1-15 (Sprint 6, ODR-021): risk + execution merged into
      # analysis. RISK_SERVICE_URL kept as a legacy fallback only
      # — the engine prefers the in-process risk manager
      # attached via WithRiskManager.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/chat/completions}
      # 模型名。留空 = 回落 pkg/ai.DefaultModel（gpt-4o-mini）。
      # 换供应商（MiniMax / DeepSeek / 通义 / OpenRouter / 本地 vLLM）必须
      # **同时**改 URL 和这里：只改 URL 会把 "gpt-4o-mini" 发给对方，对方
      # 回 model-not-found —— 协议兼容不等于模型名兼容。
      # 注意 AI_API_URL 要填完整的 chat-completions 端点，不是 base URL。
      AI_MODEL: ${AI_MODEL:-}
      # 服务间凭证（QT-77）：analysis 是 risk 的**唯一**发送方，token 只在这里注入，
      # 仓库里只有空占位。签法：JWT_SECRET=... go run ./tools/issue_service_token.go
      # -sub service:analysis -ttl 720h；口径见 docs/SPEC.md 的「服务间凭证」节。
      RISK_SERVICE_RESOLVE_TOKEN: ${RISK_SERVICE_RESOLVE_TOKEN:-}
      RISK_SERVICE_EVENTS_TOKEN: ${RISK_SERVICE_EVENTS_TOKEN:-}
      # risk 快照（2026-11-11 冷启动实测）：resolve_enabled=true 是「开着就必须
      # 取到，取不到即拒起」的 fail-closed 语义，而 risk 只在 full profile。
      # 默认 false = 内置限额兜底（启动日志 source=builtin_default），四个服务
      # 才可能开箱即起；full 里要用真规则，up 前显式 RISK_SERVICE_RESOLVE_ENABLED=true，
      # wait-for-deps.sh 会按 RISK_SERVICE_RESOLVE_URL 等 risk 就绪。
      RISK_SERVICE_RESOLVE_ENABLED: ${RISK_SERVICE_RESOLVE_ENABLED:-false}
      RISK_SERVICE_RESOLVE_URL: ${RISK_SERVICE_RESOLVE_URL:-http://risk:8089}
      LOGGING_LEVEL: info
      # AUD-58：见 data-service 里同一行的注释。缺省 100 与
      # config/analysis-service.yaml 的 rate_limit.per_minute 一致。
      # e2e 用 RATE_LIMIT_PER_MINUTE=100000 在命令行覆盖（原 e2e 覆盖层）。
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      # ── 执行通道（2026-11-11 接线；broker 已是默认栈成员）──────────────
      # 装配期无条件构造（cmd/analysis/kernel_wiring.go 的 BuildExecutionTrader），
      # 缺任一项都直接拒起：BROKER_URL 必填 → BROKER_CHANNEL 必填 → mock 还要
      # BROKER_ALLOW_MOCK=true → 启动时 GET {BROKER_URL}/version，对端自报通道
      # 必须与声明一致（pkg/brokerhttp.verifyPeerChannel）。
      # 默认是 mock：订单永不触达真实柜台。改 live 见文件头红字。
      BROKER_URL: ${BROKER_URL:-http://broker:8091}
      BROKER_CHANNEL: ${BROKER_CHANNEL:-mock}
      BROKER_ALLOW_MOCK: ${BROKER_ALLOW_MOCK:-true}
      BROKER_SERVICE_TOKEN: ${BROKER_SERVICE_TOKEN:-dev-only-mock-token}
      BROKER_ACCOUNT_ID: ${BROKER_ACCOUNT_ID:-mock}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      data-service:
        condition: service_healthy
      # broker 在默认 profile，跨 profile 依赖约束不适用；等它 healthy 再装配，
      # 避免 wait-for-deps 之外的启动竞态。
      broker:
        condition: service_healthy

  # ── ai-service :8086（AI 拆仓阶段 1，ADR-027 §5 第 8 步前置切片）────────
  # Copilot / pipeline / explore / tools 四族 handler 的宿主进程。
  # 源码在 tellurion-agent 仓（阶段 2 迁入）；构建只需 agent 仓上下文
  # （S3 已删 `replace tellurion => ../tellurion`，不再需要 core 命名上下文），
  # 依赖的 config/ai-service.yaml 与 deploy/wait-for-deps.sh 由 agent 仓自持。
  # analysis-service 对同名路径族做纯反代（handlers_ai_proxy.go），前端与
  # openapi 契约零改动。鉴权不变量同构：open-access 只许发布到 127.0.0.1
  # （检查 3c + local-stack netstat 双闸）。三态口径以 core 为基准，ai-service
  # 在 agent 仓落地前仍走二态（见其 env 段）。
  ai-service:
    build:
      context: ../tellurion-agent
      dockerfile: Dockerfile
    entrypoint: ["/bin/sh", "/app/deploy/wait-for-deps.sh"]
    command: ["/app/ai-service"]
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      # ai-service 属于 agent 仓。它的启动闸仍要求「无 secret 时必须显式
      # AUTH_INSECURE=true」，与 core 的三态口径（无 secret 也可降级启动）尚未
      # 对齐 —— 在 agent 仓落三态之前这里保持显式 true，避免默认栈起不来。
      # agent 仓落地后改为 ${AUTH_INSECURE:-false}，与 analysis-service 一致。
      # TODO(6-repo-auth-three-state): agent 仓三态落地后收紧这一行。
      AUTH_INSECURE: ${AUTH_INSECURE:-true}
      AUTH_INSECURE_EXPOSURE: ${AUTH_INSECURE_EXPOSURE:-loopback-published}
      # 密钥优先于 AUTH_INSECURE（bootstrap.DecideAuthStartup 先看密钥）。
      JWT_SECRET: ${JWT_SECRET:-}
      SERVER_CORS_ALLOWED_ORIGINS: ${SERVER_CORS_ALLOWED_ORIGINS:-}
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_DATABASE: ${DATABASE_NAME:-tellurion}
      # 本仓无 Redis 依赖（2026-11-12 CORE-REDIS-EXIT 已删 go-redis 与读取点）。
      DATA_SERVICE_URL: http://data-service:8081
      # factor.compute / factor.evaluate / compute_factor_ic 在当前栈上不可用：
      # core 只注册 POST /api/factor/registrations 与反代 GET /api/factors/:name，
      # 没有 /api/factor/compute|evaluate（ADR-041）。三个工具显式返回「能力未提供」，
      # 不发请求；该 URL 保留仅用于将来重新接线。
      AI_SERVICE_FACTOR_API_URL: http://analysis-service:8085
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-}
      # LLM 请求超时（Go duration 或裸秒数）。出厂 180s：真栈实测 30s 在一次
      # copilot 代码生成上恒 `context deadline exceeded`；重试次数不由此改。
      AI_HTTP_TIMEOUT: ${AI_HTTP_TIMEOUT:-180s}
      LOGGING_LEVEL: info
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      data-service:
        condition: service_healthy
      # 方向单向：ai 等 analysis 就绪（ai 的 Boot 要解析 analysis 主机名），
      # 而 analysis 不再在 Boot 期解析 ai（可选下游改为首次调用时解析）。
      analysis-service:
        condition: service_healthy

  # QT-79 / D-DEPLOY-1 = A 已于 2026-11-11 **撤销**（主任指令：本地编排必须
  # 单一文件，避免三份各说各话）。原代裁担心「data 与 data-service 双发布
  # 8081」——新方案只保留 data-service 一份，聚合栈的 data 服务已删除。
  #
  # worker 是**无监听**的长驻进程（向 orchestration 注册 + 心跳 + 领活），因此：
  #   - 不给它造 HTTP /healthz（验收原文：「心跳成功 + 能领到活」才是健康判据）；
  #   - 编排服务在 `full` profile ⇒ 默认不启动 worker；只开 worker 而不开 full
  #     时，cmd/worker 对不可达编排是 fail-closed 退出（非 0），不是「空跑成功」。
  worker:
    profiles: ["orchestration-worker"]
    build:
      context: .
      dockerfile: Dockerfile.service
    entrypoint: ["/bin/sh", "/app/wait-for-deps.sh"]
    command: ["/app/worker"]
    environment:
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_DATABASE: ${DATABASE_NAME:-tellurion}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      # 编排服务在 `full` profile，容器内直接用 compose 服务名。
      ORCHESTRATION_URL: ${ORCHESTRATION_URL:-http://orchestration:8088}
      # 全量 R5（SVC-ORCH-G1）后编排面的每条路由都要 service 凭证；
      # 只给发送方注入，仓库里只有空占位（签法见 docs/SPEC.md#服务间凭证）。
      ORCHESTRATION_SERVICE_TOKEN: ${ORCHESTRATION_SERVICE_TOKEN:-}
      # worker 的行情通道与 analysis 同源（bootstrap.BuildBacktestEngine 读
      # data_service.url）。yaml 默认是宿主机视角 localhost:8081；容器里必须
      # 显式指向 compose 服务名，否则取数会打到 worker 自己容器上。
      DATA_SERVICE_URL: http://data-service:8081
      # ruleset 装配与 analysis 用同一组键。yaml 默认 resolve_url 是宿主机视角
      # localhost:8089，且 resolve_enabled=true —— worker 容器里照抄会拒起
      # （localhost 是容器自己）。这里与 analysis 保持同一档位：
      # 默认 false = 用代码常量限额，要真快照就 up 前显式置 true。
      RISK_SERVICE_RESOLVE_ENABLED: ${RISK_SERVICE_RESOLVE_ENABLED:-false}
      RISK_SERVICE_RESOLVE_URL: ${RISK_SERVICE_RESOLVE_URL:-http://risk:8089}
      RISK_SERVICE_RESOLVE_TOKEN: ${RISK_SERVICE_RESOLVE_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-}
      LOGGING_LEVEL: info
    # worker 启动即注册；编排还没 healthy 时会 DNS 解析不到并 fail-closed 退出。
    # 因此显式等编排与取数面就绪 —— 这是起栈顺序，不是健康判据放宽。
    depends_on:
      orchestration:
        condition: service_healthy
      data-service:
        condition: service_healthy
    restart: "no"

  # dualrun 是**一次性验收门**（K15 双跑差异报告），跑完退出码即结论：
  #   - 默认 profile 不启动（避免 `compose up` 起完就退出）；
  #   - 报告写到挂载出来的 ./reports（容器内 /app/reports）。
  dualrun:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile.service
    entrypoint: ["/bin/sh", "/app/wait-for-deps.sh"]
    # dualrun 的 -pg 默认值是宿主机的 127.0.0.1；容器里那个地址是容器自己，
    # 所以必须显式给一个容器可达的 DSN（与上面的 DATABASE_HOST 同义）。
    command:
      - "/app/dualrun"
      - "-pg"
      - "${DUALRUN_PG_DSN:-postgres://postgres:postgres@host.docker.internal:5432/${DATABASE_NAME:-tellurion}?sslmode=disable}"
      - "-out"
      - "/app/reports/dualrun-latest.md"
    environment:
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_DATABASE: ${DATABASE_NAME:-tellurion}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      LOGGING_LEVEL: info
    volumes:
      - ./reports:/app/reports
    restart: "no"

  # ══════════════════════════════════════════════════════════════════════
  # full profile：分析 / 风控 / 编排面（2026-11-11 从 docker-compose.services.yml
  # 并入）。数据库统一走宿主机原生 16.15 —— 不再起容器 PG：那会与 5432 抢端口，
  # 并制造第二份数据（旧聚合栈因此根本起不来）。
  # 四个服务都是**验签方**：JWT_SECRET 与 analysis 同源。不设 secret 时
  # analysis 走三态降级；这四个服务在各自仓的三态改造落地前仍按「无 secret +
  # loopback 发布 = open-access」运行（见各 env 段注释）。容器必须绑 0.0.0.0
  # 才能发端口，无 secret 时靠 AUTH_INSECURE_EXPOSURE 显式声明「只发布到回环」，
  # 缺它会被各自的启动闸拒绝（kit DecideStartup）。
  # ══════════════════════════════════════════════════════════════════════
  risk:
    profiles: ["full"]
    build:
      context: ../tellurion-risk
      dockerfile: Dockerfile
    image: tellurion-risk:dev
    command: ["-addr", "0.0.0.0:8089"]
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      # 要换库改 .env 的 DATABASE_PASSWORD（或直接改本行）。
      RISK_DATABASE_URL: postgres://postgres:${DATABASE_PASSWORD:-postgres}@host.docker.internal:5432/${DATABASE_NAME:-tellurion}?sslmode=disable
      # 与 analysis 同源：设了 JWT_SECRET 则四个 full 服务一起验签。不设时
      # analysis 已按三态降级（写面 503），而这四个仓的三态改造尚未落地，仍按
      # 「无 secret + loopback 发布 = open-access」启动（各自仓任务跟进后收紧）。
      # 容器绑 0.0.0.0，无 secret 时必须显式声明 loopback-published 才让启动闸
      # （kit DecideStartup）放行。
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_INSECURE_EXPOSURE: ${AUTH_INSECURE_EXPOSURE:-loopback-published}
      # G4：monitor 的 configured 判别位是**部署声明**，必须与 core 的
      # risk_service.events_enabled 一致；缺省 false 与 core 出厂值对齐。
      RISK_EVENTS_EXPECTED: ${RISK_EVENTS_EXPECTED:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8089/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  strategy:
    profiles: ["full"]
    build:
      context: ../tellurion-strategy
      dockerfile: Dockerfile
    image: tellurion-strategy:dev
    command: ["-addr", "0.0.0.0:8090", "-cache-dir", "/data/artifacts"]
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      STRATEGY_DATABASE_URL: postgres://postgres:${DATABASE_PASSWORD:-postgres}@host.docker.internal:5432/${DATABASE_NAME:-tellurion}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-}
      # 容器内绑 0.0.0.0 才能发端口，但只发布在宿主回环 —— 无 secret 时靠这一项
      # 让启动闸放行；缺它则按设计拒绝启动。
      AUTH_INSECURE_EXPOSURE: ${AUTH_INSECURE_EXPOSURE:-loopback-published}
    volumes:
      - strategy-artifacts:/data/artifacts
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8090"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  analytics:
    profiles: ["full"]
    build:
      context: ../tellurion-analytics
      dockerfile: Dockerfile
    image: tellurion-analytics:dev
    command: ["-addr", "0.0.0.0:8087"]
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      ANALYTICS_DATABASE_DSN: postgres://postgres:${DATABASE_PASSWORD:-postgres}@host.docker.internal:5432/${DATABASE_NAME:-tellurion}?sslmode=disable
      # core / data / orchestration 都是 compose 成员，直接用服务名（原聚合栈
      # 因为没有 core，才不得不走 host.docker.internal）。
      ANALYTICS_CORE_URL: ${ANALYTICS_CORE_URL:-http://analysis-service:8085}
      ANALYTICS_DATA_URL: ${ANALYTICS_DATA_URL:-http://data-service:8081}
      # QT-78：artifact 读面（portfolio-snapshot / factor-exposures）由 core 自持，
      # 路径是 `{base}/runs/{id}/{kind}` ⇒ base 必须带 /api。
      ANALYTICS_ARTIFACT_URL: ${ANALYTICS_ARTIFACT_URL:-http://analysis-service:8085/api}
      ANALYTICS_ORCHESTRATION_URL: ${ANALYTICS_ORCHESTRATION_URL:-http://orchestration:8088}
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_INSECURE_EXPOSURE: ${AUTH_INSECURE_EXPOSURE:-loopback-published}
      # 发送方持有三个 service token（空占位；签发见 docs/SPEC.md「服务间凭证」）。
      DATA_SERVICE_TOKEN: ${DATA_SERVICE_TOKEN:-}
      ANALYTICS_CORE_TOKEN: ${ANALYTICS_CORE_TOKEN:-}
      ANALYTICS_ARTIFACT_TOKEN: ${ANALYTICS_ARTIFACT_TOKEN:-}
      # 全量 R5（SVC-ORCH-G1）后 `/api/runs/parents` 需要 service 角色。
      ANALYTICS_ORCHESTRATION_TOKEN: ${ANALYTICS_ORCHESTRATION_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8087/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  orchestration:
    profiles: ["full"]
    build:
      context: ../tellurion-orchestration
      dockerfile: Dockerfile
    image: tellurion-orchestration:dev
    command: ["-addr", "0.0.0.0:8088"]
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      # DSN 为空时本服务按设计拒绝启动（fail-closed）。
      ORCHESTRATION_DSN: postgres://postgres:${DATABASE_PASSWORD:-postgres}@host.docker.internal:5432/${DATABASE_NAME:-tellurion}?sslmode=disable
      # 验签方：SVC-ORCH-G1 起 /api/* 全量 service 角色；/healthz /readyz 公开。
      JWT_SECRET: ${JWT_SECRET:-}
      AUTH_INSECURE_EXPOSURE: ${AUTH_INSECURE_EXPOSURE:-loopback-published}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # nt-sidecar：可选旁路样本（原 docker-compose.nt.yaml）。默认不起。
  # 回环约束（ADR-031 D5）要求容器共享宿主网络命名空间，否则 127.0.0.1 不可达；
  # host 网络在 Linux 上开箱可用，Docker Desktop 支持有限 —— Windows 下直接在
  # 宿主机 `python -m sidecar`。绝不要把 --host 改成 0.0.0.0（会被启动守卫拒绝）。
  nt-sidecar:
    profiles: ["nt"]
    build:
      context: ./nt-sidecar
      dockerfile: Dockerfile
    image: tellurion/nt-sidecar:2.0.0rc6
    network_mode: host
    volumes:
      - ./nt-sidecar/catalog:/catalog:ro
    restart: unless-stopped

volumes:
  # strategy 的编译产物。旧项目 tellurion-services 下的同名卷不会自动迁移
  # （产物可重建）；需要旧数据时手工 docker volume 拷出，不要用 prune。
  strategy-artifacts:

# 注意：web 服务已随前端拆仓移除（2026-10-09，web/ → tellurion-ui）。
# 前端现在由 tellurion-ui 仓独立构建/托管（该仓的 Dockerfile 与
# deploy/nginx-spa.conf），后端仍是本仓的 analysis-service:8085。

# 注意：原先这里声明了 postgres_data / redis_data 两个卷。
# 数据库与缓存移出容器后它们不再被任何服务挂载。**本文件不再声明**，但
# 改名前的旧卷 quant-trading_postgres_data（1.26GB）/
# quant-trading_redis_data 仍留在磁盘上（compose 删声明不删卷）。
# 里面是旧的容器版数据 —— 已知为**空库**（表结构就绪、业务表 0 行，
# 见 docs/TEST.md）。确认不再需要时用显式删除回收：
#   docker volume rm quant-trading_postgres_data quant-trading_redis_data
# ⛔ 不要用 `docker volume prune` 代替 —— 它会连带删掉四个 Go 构建缓存卷。
