# tellurion · 六个服务仓的本地聚合（ADR-036 G0）
#
# 用法：
#   docker compose -f docker-compose.services.yml up --build
#
# 定位：只跑「六个服务 + PostgreSQL」，用于验证每仓的 Dockerfile / deploy / health。
# **不与 `docker-compose.yml` 合并使用**（D-DEPLOY-1 = A，2026-11-07 代裁）：两份文件
# 各自是单一 owner 的完整栈；合并会让 `data`（服务仓，8081）与 `data-service`
# （core 进程，8081）同时发布同一端口，且项目名被本文件的 `name:` 覆盖。
# core（analysis/agent）不在本文件里；需要时用 core 自己的 compose 或本机进程，
# analytics 的 ANALYTICS_CORE_URL 默认指向宿主 8085。
#
# 数据自治：同一个 PG 实例、按 schema 隔离（market/ingest、risk、strategy、analysis、run），
# 不要求每个服务一个物理库（ADR-036 §3）。
name: tellurion-services

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tellurion
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tellurion-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tellurion"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  data:
    build:
      context: ../tellurion-data
      dockerfile: Dockerfile
    image: tellurion-data:dev
    command: ["-addr", "0.0.0.0:8081"]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/tellurion?sslmode=disable
      DATA_MARKET_SCHEMA: market
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  risk:
    build:
      context: ../tellurion-risk
      dockerfile: Dockerfile
    image: tellurion-risk:dev
    command: ["-addr", "0.0.0.0:8089"]
    ports:
      - "127.0.0.1:8089:8089"
    environment:
      RISK_DATABASE_URL: postgres://postgres:postgres@postgres:5432/tellurion?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  strategy:
    build:
      context: ../tellurion-strategy
      dockerfile: Dockerfile
    image: tellurion-strategy:dev
    command: ["-addr", "0.0.0.0:8090", "-cache-dir", "/data/artifacts"]
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      STRATEGY_DATABASE_URL: postgres://postgres:postgres@postgres:5432/tellurion?sslmode=disable
      # 启动闸（kit DecideStartup）：容器内绑 0.0.0.0，无 secret 时必须显式声明
      # AUTH_INSECURE_EXPOSURE=loopback-published 才能起。聚合栈与其余验签方共用
      # 同一 dev secret（同 tellurion-strategy:deploy/compose.yaml 的口径）。
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    volumes:
      - tellurion-strategy-artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  analytics:
    build:
      context: ../tellurion-analytics
      dockerfile: Dockerfile
    image: tellurion-analytics:dev
    command: ["-addr", "0.0.0.0:8087"]
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      ANALYTICS_DATABASE_DSN: postgres://postgres:postgres@postgres:5432/tellurion?sslmode=disable
      ANALYTICS_CORE_URL: ${ANALYTICS_CORE_URL:-http://host.docker.internal:8085}
      ANALYTICS_DATA_URL: http://data:8081
      # QT-78：R2 分析产物读面由 core 自持（quant.run_analysis_artifacts）。
      # analytics 读 `{base}/runs/{id}/{kind}`，所以 base 必须带 /api。
      ANALYTICS_ARTIFACT_URL: ${ANALYTICS_ARTIFACT_URL:-http://host.docker.internal:8085/api}
      ANALYTICS_ORCHESTRATION_URL: http://orchestration:8088
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      # 服务间凭证（QT-77）：只给**发送方**注入，仓库里只有空占位。
      # 签法见 tellurion:docs/SPEC.md#服务间凭证：签发、分发与轮换。
      DATA_SERVICE_TOKEN: ${DATA_SERVICE_TOKEN:-}
      ANALYTICS_CORE_TOKEN: ${ANALYTICS_CORE_TOKEN:-}
      # 空值 = analytics 复用 ANALYTICS_CORE_TOKEN（同一条 core 鉴权面）。
      ANALYTICS_ARTIFACT_TOKEN: ${ANALYTICS_ARTIFACT_TOKEN:-}
      # 全量 R5（SVC-ORCH-G1）后 `/api/runs/parents` 需要 service 角色。
      ANALYTICS_ORCHESTRATION_TOKEN: ${ANALYTICS_ORCHESTRATION_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  orchestration:
    build:
      context: ../tellurion-orchestration
      dockerfile: Dockerfile
    image: tellurion-orchestration:dev
    command: ["-addr", "0.0.0.0:8088"]
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      ORCHESTRATION_DSN: postgres://postgres:postgres@postgres:5432/tellurion?sslmode=disable
      # 凭证来源（QT-77）：本服务是验签方（kit 启动闸 + 全量 R5，SVC-ORCH-G1 已落）；
      # 与同栈其余验签方共用同一 secret，否则 analytics 签出的 service token 在这里验不过。
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  broker:
    build:
      context: ../tellurion-broker
      dockerfile: Dockerfile
    image: tellurion-broker:dev
    command: ["-addr", "0.0.0.0:8091", "-account-id", "mock", "-cash", "100000000"]
    ports:
      - "127.0.0.1:8091:8091"
    restart: unless-stopped

volumes:
  tellurion-pg:
  tellurion-strategy-artifacts: