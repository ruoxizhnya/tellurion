server:
  host: "0.0.0.0"
  port: 8085

  # AUD-29: gin 的运行模式。debug | release | test。
  # 未配置、或写了不认识的值，一律按 release 处理（fail-safe：gin 自己的
  # 默认是 debug，一个笔误不该让线上进程开始打路由表）。
  # 它只描述「框架的调试输出」，与日志格式/级别无关 —— 此前 analysis 由
  # logging.format 推断、data/strategy 由 logging.level 推断，同一份配置
  # 在三个服务上会得出不同的 gin mode。
  # env 覆盖：SERVER_GIN_MODE
  gin_mode: "release"

  # P0-4: CORS 跨源白名单。未配置（空）= 不回显任何
  # Access-Control-Allow-Origin，浏览器侧一律拦截（fail closed）。
  # 只有确实要让独立站点直连时才填，且不要写 "*" 除非有意对外开放。
  # env 覆盖：SERVER_CORS_ALLOWED_ORIGINS="http://a.example,http://b.example"
  #
  # 注意：dev 下 Vite 已代理 /api（web/vite.config.ts），同源，不需要配这里。
  cors:
    allowed_origins: []

# P0-4: 鉴权。**没有密钥服务拒绝启动**（此前是静默进入 open-access）。
# 密钥只从 env 注入，不要写进这份入库的 YAML：
#   JWT_SECRET（或 AUTH_JWT_SECRET）= openssl rand -hex 32
#
# 本地开发有**两条**豁免路径，都必须显式声明，且都要求
# `AUTH_INSECURE=true`：
#
#   a) server.host 是 loopback（127.0.0.1 / localhost）——  原生跑法
#   b) auth.insecure_exposure = loopback-published —— **容器跑法**
#
# (b) 存在的理由：容器必须绑 0.0.0.0 才能被发布端口转发，所以 isLoopbackHost
# 档不住它 —— 于是判据从「绑定地址」换成「发布层」。**基础不变量没有放松**：
# open-access 仍不得从其他主机到达，只是保证的位置挪到了 compose 的 ports
# 映射（四条全带 127.0.0.1: 前缀），并由两处机器校验守：
#   tools/check_deploy_consistency.py 检查 3c（静态，双向）
#   tools/local-stack.sh（运行时，读宿主机 netstat）
# 取值必须逐字等于 loopback-published；拼错/空/近义词一律按没声明处理 → 拒绝启动。
#
# 两条都不满足时照样拒绝 —— 0.0.0.0 上的 open-access 等于把下单接口开给整个
# 局域网。豁免生效时会打 WARN 横幅（容器形态下还会带上 exposure 与保证方）。
auth:
  # jwt_secret: 只从 env 读，此处留空
  jwt_secret: ""
  allow_insecure: false        # env: AUTH_INSECURE（本地豁免的总开关）
  # env: AUTH_INSECURE_EXPOSURE。只认 loopback-published（见上 (b)）。
  insecure_exposure: ""
  issuer: "tellurion"
  access_token_ttl: 15m
  refresh_token_ttl: 168h      # 7d

# 网关限流（每 ClientIP / 每分钟窗口）。env 覆盖：RATE_LIMIT_PER_MINUTE
# （viper AutomaticEnv）；e2e/压测调高、事故响应调低（ODR-013 模式）。
rate_limit:
  per_minute: 100

# 数据库。密码**只能**从 env 注入（DATABASE_PASSWORD）。
#
# AUD-39：这里此前写的是字面量 "${DATABASE_PASSWORD}"。本仓**没有**任何
# env 展开器（全仓无 os.ExpandEnv / envsubst），YAML 里的 ${...} 不是模板，
# 就是那 22 个字符本身 —— 它会被当成密码交给驱动，失败点在 TCP 连上之后，
# 日志里只有 "password authentication failed"，读起来像「密码错了」而不是
# 「没填密码」。k8s 侧因为注入的 env 名不匹配（见 deploy/k8s/configmap.yaml），
# 应用拿到的正是这个字面量。
#
# 现在改成空串 + 启动期校验（pkg/storage.BuildDSN）：空密码直接 Fatal 并
# 告诉你填 DATABASE_PASSWORD。注意这里是**空**，不是占位符 —— 占位符会被
# BuildDSN 当成错误（ErrDSNPlaceholder）。
#
# url 留空 = 由下面的逐字段拼装；它同时是 DATABASE_URL 的覆盖点，方便嵌入方
# 直接给完整 DSN。这条不变量由 tools/check_deploy_consistency.py 的检查 7 守护
# （config/*.yaml 里不得出现 ${）。
database:
  url: ""
  host: "localhost"
  port: 5432
  user: "postgres"
  password: ""
  database: "tellurion"
  sslmode: "disable"

# ── 地址口径（2026-11-11 统一）：本文件是**宿主机直跑视角** ──────────
# DB / Redis / 所有服务地址默认都指向本机（localhost:<port>）。容器内一律
# 由 docker-compose.yml / deploy/k8s 的 environment 覆盖成服务名 ——
# compose 服务名（data-service / ai-service / strategy）只在容器网络内可解析，
# 宿主机上解析不到。
#
#   key                          env 覆盖名                   宿主机默认
#   data_service.url             DATA_SERVICE_URL             http://localhost:8081
#   ai_service.url               AI_SERVICE_URL               http://localhost:8086
#   strategy_asset.resolve_url   STRATEGY_ASSET_RESOLVE_URL   http://localhost:8090
#   risk_service.resolve_url     RISK_SERVICE_RESOLVE_URL     http://localhost:8089
#   risk_service.events_url      RISK_SERVICE_EVENTS_URL      （启用时必填，无默认）
#
# 启动期逐项解析主机名（pkg/bootstrap.ValidateServiceEndpoint）：宿主机上留着
# 容器 DNS 会在**启动时**报错并点名该注入哪个 env，而不是等第一条业务请求在
# 远处 connection refused / no such host。
#
# Redis：本仓已无运行时读取点（2026-11-10 起 compose 的 REDIS_URL 移除，
# 见 deploy/k8s/configmap.yaml）。键保留只为与 data-service.yaml 的历史口径
# 一致；本地 redis 不校验密码，这里也不放密码。
redis:
  url: "redis://localhost:6379"

data_service:
  url: "http://localhost:8081"
  # 裁-15：tellurion-data 已上鉴权闸（`/datasets/*` 要 viewer 角色）。
  # 配了 secret 的部署必须在这里给服务间凭证，否则 core 取数全线 401。
  # token 只从 env 注入（DATA_SERVICE_TOKEN），本文件不放真值。
  token: ""

# AI 拆仓后 analysis 对四族 AI 路由做纯反代（cmd/analysis/handlers_ai_proxy.go）。
# 宿主机默认指向本机 8086；容器里由 compose 的 AI_SERVICE_URL 覆盖成
# http://ai-service:8086（漏配的后果是四族全 503，而 ai-service 自己健康）。
ai_service:
  url: "http://localhost:8086"

# QT-78：run 级分析产物（portfolio-snapshot / factor-exposures）的默认基准。
# worker 在 run 终态时为 Brinson 归因算基准分行业权重/收益；单条 run 可用
# `engine_params.benchmark_index_code` 覆盖（open map，不动冻结的响应契约）。
# 缺数据时产物不落库（fail-closed），不拿空权重冒充基准。
benchmark:
  index_code: "000300.SH"

# strategy_service.url 已随 OBS-11（2026-10-09）删除：策略服务 standby
# （ADR-012），信号只从引擎本地注册表产出，不存在 per-day HTTP fallback。

# QT-32 K11：AI 产物（非空 `strategy_ref`）的回测入口闸门。
#
# 语义：`strategy_ref` 非空 ⇒ 必须先向 tellurion-strategy 询问「这个版本是否
# 已过人工 promote 且有审批留痕」，否则拒绝（fail-closed）。空 `strategy_ref`
# 的内置策略路径不解析、不联网，行为逐字节不变。
#
#   - resolve_enabled=false ⇒ 本部署视为「未接入资产服务」：非空 strategy_ref
#     一律拒绝（503 strategy_asset_not_configured），内置策略不受影响。
#   - resolve_enabled=true 但 resolve_url 为空 ⇒ 启动即失败（配置错误不拖到
#     第一条 AI run 才暴露）。
#   - 拒绝口径：404 资产不存在 / 409 未 promote 或缺审计 / 502 资产服务返回
#     畸形或 5xx / 503 连不上或未配置。**没有任何一条会回落到内置策略**。
#
# 注意：analysis 与 worker 读同一份文件，两个进程都必须看到同一组值。
strategy_asset:
  resolve_enabled: true
  # tellurion-strategy 资产服务的地址。宿主机直跑默认本机 :8090；容器里由
  # compose 的 STRATEGY_ASSET_RESOLVE_URL 覆盖成宿主网关（该服务不在本栈内）。
  resolve_url: "http://localhost:8090"
  # 读面今天端口隔离、不校验凭证；预留以便网关统一鉴权（只从 env 注入）。
  resolve_token: ""
  resolve_timeout: 10s

# P1-15 (Sprint 6, ODR-021): risk + execution services merged into
# analysis service. The `risk_service.url` and the
# `STRATEGY_SERVICE_URL` env on docker-compose still work for backward
# compat (in case someone deploys a separate risk service), but the
# canonical runtime is in-process — `trading` below is the single source
# of truth for execution. **风控限额不在这里**：真相源是 tellurion-risk
# 的规则快照（见下面 resolve_* 与本文件 §限额说明）。
risk_service:
  url: "http://localhost:8085"  # legacy fallback only
  # QT-66（裁-10 / 裁-11）：run 提交时向 tellurion-risk 取规则快照 hash。
  # resolve_enabled=false ⇒ 本部署视为「未接入 risk 服务」，provenance 的
  # risk_rules_hash 记空串 + not_configured（唯一允许空串的情形）。
  # 启用后取不到（no_approved_rules / snapshot_not_found / 5xx / 超时）⇒
  # run 直接 failed（risk_rules_unavailable），不会用默认限额继续跑。
  #
  # SVC-CORE-RISK-RETIRE（2026-11-09）：出厂值 **false → true**。同一开关
  # 还决定进程内 RiskManager 的 14 个限额从哪来 —— true = 启动期取快照
  # （真相源，取不到即拒绝启动）；false = `risk.BuiltinPolicy()` 代码常量
  # 兜底，启动日志明示 source=builtin_default。长期观测看这条日志。
  # resolve_url 必填（**不**回落到上面的 url：那一项指向 analysis 自己的
  # 进程内风控 :8085，没有 /api/risk/resolve）。tellurion-risk 的默认监听是
  # **127.0.0.1:8089**（ADR-036 G0：8086 留给 ai-service，本仓曾按 risk 的旧
  # 默认写成 8086，结果是启动期 resolve 打到 ai-service / 拒连，进程直接拒起）。
  # resolve_token：服务间凭证。risk 配了 AUTH_JWT_SECRET 后必填，否则 401。
  # resolve_timeout 缺省 10s。
  resolve_enabled: true
  resolve_url: "http://localhost:8089"
  resolve_token: ""
  resolve_timeout: "10s"
  # QT-42 X3c 的 core 腿（告警生产侧接线）：把 pkg/alert 的 detector 告警按
  # POST /api/risk/events 回传，risk 的 monitor/alerts 与 monitor/evaluate 因此
  # 不再是空集。events_enabled=false ⇒ 不注册通道（本部署视为未接入 risk 服务）。
  # 事件映射：run_id 固定 "core:alert-loop"、order_id = Alert.ID、event_seq=0、
  # verdict="alert"、payload = Alert 原样 JSON（risk 投影要 rule/severity/message）。
  # events_url **必填**（启用时）：**不**回落到上面的 url —— :8085 是 analysis 自己
  # （P1-15 合并后的进程内风控），没有这个端点，回落等于把「少配一项」变成每条
  # 告警 404、且要等告警真触发才看得见，所以装配期直接拒。
  # 端口口径：`tellurion-risk:cmd/riskservice` 的 `-addr` 默认是 127.0.0.1:8089
  # （ADR-036 G0；8086 是 ai-service），上面的 resolve_url 与之对齐；
  # events_url 按你实际的部署填。
  # events_token 为空 ⇒ 不带 Authorization；risk 侧 policy 表要 trader/admin 角色，
  # 配了 AUTH_JWT_SECRET 而无凭据会收到 401 并记 error 日志。token 只从 env
  # RISK_SERVICE_EVENTS_TOKEN 注入（本文件不放真值）。
  # 交付形态 = outbox：每条告警先落 quant.alert_outbox 一行（Migration 060），
  # 后台每 events_relay_interval 领一批 POST（Migration 061 的行级租约，多进程
  # 不会领到同一行）；失败不丢，只是那行还是 pending，试到 events_max_attempts
  # 次转 failed 终态留在表里等人查。
  # 所以「risk 服务不可用」不再等于「那段时间的告警没了」——重启后行还在。
  events_enabled: false
  events_url: ""
  events_timeout: "10s"
  events_batch_size: 50
  events_relay_interval: "15s"
  events_max_attempts: 8
  # 关停期最后一轮 relay 的**总**预算（含领取 + 投递 + 回写）。到点即弃：
  # 行不删、仍是 pending，由下一个进程带走。留空 = events_timeout。
  events_shutdown_budget: "10s"
  events_token: ""

# 进程内风控的限额**不再**来自本文件（SVC-CORE-RISK-RETIRE，2026-11-09）。
#
# 14 个限额标量（仓位规模 5 项 / 止损 5 项 / 止盈 1 项 / 市场状态 3 项）的
# 真相源是 tellurion-risk 的规则快照：启动期 `POST /api/risk/resolve`
# → `risk.PolicyFromSnapshot`（contracts/risk 重新 derive hash 校验）
# → 进程内 RiskManager。原先的 `risk_manager:` 块已删，这是有意的 ——
# 同一份限额不再有两个真相；未接入（resolve_enabled=false）时用
# `risk.BuiltinPolicy()` 的代码常量兜底，启动日志会明示 source=builtin_default。

# ── AlertManager + PeriodicAlertLoop (P2 alert, ODR-025) ──────────
#
# The 6 P0 risk rules evaluate the live portfolio on every tick
# of the periodic loop (default 5min). Alerts are dispatched to:
#   1. LogChannel (always-on, structured zerolog)
#   2. WebhookChannel (when webhook_url is set)
#   3. RecorderChannel (in-process ring buffer for /api/alerts/history)
#   4. RiskEventSink (when risk_service.events_enabled — POST /api/risk/events,
#      the producer behind risk's monitor/alerts; see the risk_service block)
#
# 告警阈值**不在这里**（SVC-CORE-RISK-RETIRE，2026-11-09 代裁，待主任追认）：
# 5 个探测器阈值是 `pkg/alert` 的**探测器**参数（U7：检测器留进程内），与
# risk 快照的限额不是同一个量（探测阈值高于快照限额，比较的是不同东西），
# 且 sector / drawdown / daily-loss / failure-rate 在快照里没有对应规则类型
# ⇒ 不从 bundle 派生，固定为 `cmd/analysis/setup.go` 的代码常量。
# 本文件只留告警的**运行参数**（开关 / 周期 / 通道）。
#
# A 0 or empty value disables the corresponding rule.
alert:
  enabled: true
  interval_sec: 300           # 5min between evaluations
  history_limit: 100          # ring buffer for /api/alerts/history
  recorder_capacity: 100      # recorder channel capacity
  webhook_url: ""             # empty = webhook disabled
  webhook_timeout_sec: 5

# ── ReconciliationWorker (K16 ⑤) ─────────────────────────────────
#
# 资金对账 worker：定时比对本地账 vs 券商账，差异逐条经
# alert.ReconciliationDispatcher 进告警通道（log + webhook，与上方
# alert.* 共用通道集）。
#
# enabled: false = worker 不启动（默认；/api/reconciliation 路由返回 503）。
# 自检形态（当前）：broker 侧视图 = 同一执行通道（broker HTTP）的账户视图，
# 账实差异恒零；真实券商适配器落地后只替换 broker 侧实现，此配置不变。
reconciliation:
  enabled: false
  account_id: "default"
  interval_sec: 900           # 监管下限 15min（中国结算 §3.2）
  cash_tolerance: 0.01
  quantity_tolerance: 0.0
  market_value_tol: 0.005
  fee_tolerance: 0.01
  report_path: "compliance/reconciliation"
  history_limit: 100

backtest:
  initial_capital: 1000000.0
  commission_rate: 0.0003
  slippage_rate: 0.0001
  risk_free_rate: 0.03

  # QT-12 ④ · run 准入闸（并发上限 / 有界队列 / 内存预算）。
  # 四个键都**可以不写**：缺省 = max_concurrent_runs = min(GOMAXPROCS, 4)、
  # max_queued_runs = 上面的值 × 4、单 run 预算 1 GiB、进程预算 4 GiB。
  # 刻意不在这里写死数值：把 min(GOMAXPROCS,4) 抄成一个固定 4，在小机器上
  # 等于悄悄放宽并发（方向危险 —— 闸只会因此变松，不会变紧）。
  #
  # 降级顺序（写死在引擎里，配置改不了）：并行取数度 → 预加载窗口 → 拒绝。
  # 收缩预加载窗口**不改回测结果**，只让未预加载的那些天退回 provider。
  #
  # max_concurrent_runs: 2          # 同时在跑的 run 上限
  # max_queued_runs: 0              # 0 是合法档位：槽位满即拒（429），不排队
  # run_memory_budget_bytes: 536870912     # 单 run 缓存预算（估算，非 profiler）
  # process_memory_budget_bytes: 2147483648  # 在跑 run 的缓存总账

# D7 · 市场 → 内核 路由表（热转换，蓝图 §2.1）
#
# 同步回测端点（POST /api/backtest）接受一个可选的 `market` 字段，在**路由
# 之前**按本表解析成内核名并写进既有的 RunSpec.kernel 字段 —— 四契约零改动。
#
#   market:  带 market 的请求按本表解析；未登记市场 → 400（点名市场 + 已登记
#            集合），**绝不**回退 go 内核（FR-1.3）。不带 market 的请求原样
#            走 kernel 字段 / 默认内核，行为与 D7 之前逐字节一致。
#   新市场:  加一行 + 对应的数据 connector，不改路由代码。
#   删掉本节: 空表 → 带 market 的请求一律 400，存量请求不受影响。
#
# 值必须是已注册的内核名（`go` 恒可用；`nautilus` 需 NT_SIDECAR_ENABLED=1）。
kernel_routing:
  markets:
    CN: go
    US: nautilus

# Sprint 6 P0-4 (ODR-013): AI Copilot sandbox Stage 1
#
# `working_dir` is the directory `go build` runs in when compiling
# LLM-generated strategy code. It MUST contain a `go.mod` that
# resolves `github.com/ruoxizhnya/tellurion-contracts/domain`
# (QT-05 B1 moved the domain types out of this repo). Empty
# value = service refuses to build any generated strategy (fails
# closed with status="sandbox_rejected").
#
# Production: point this at the deployed repo root, e.g.
#   working_dir: "/opt/tellurion"
# CI:  working_dir: "/Users/runner/work/tellurion/tellurion"
# Local dev: working_dir: ""   (then the API will return sandbox_rejected
#   and the operator will see a clear error in the response body)
copilot:
  working_dir: ""

# A-share trading rules
#
# AUD-37：这一整块由**回测引擎**读取 —— pkg/backtest 的 NewEngine 现在读
# 顶层 `trading` 键（v.UnmarshalKey("trading", ...)），同时 cmd/analysis
# 的实盘执行路径也读其中的 stamp_tax_rate / min_commission。一个来源，
# 引擎与实盘不会各用一套费率假设。
#
# 此前引擎读的是 `backtest.trading.*`，而这份文件里根本没有那个键 ——
# 所以整块是**死的**：改了没有任何可观察效果（7 个键的值又恰好都等于
# 代码里的默认值，所以一直没人发现）。新增或改名键时请跑 pkg/backtest 的
# TestTradingBlockInServiceConfigHasNoDeadKeys，它会把没人读的键报出来。
trading:
  # 印花税（仅卖出）：0.05%。2023-08-28 起从 0.1% 减半（财政部/税务总局
  # 2023 年第 39 号公告）。AUD-06 (ODR-065)：此前写 0.001（0.1%），
  # 是减半前的旧税率，会让每次卖出多算一倍的印花税。
  stamp_tax_rate: 0.0005
  # 减半前的历史税率（仅卖出），适用于 2023-08-28 之前的交易日；跨该日期
  # 的回测按**交易日**取档（fees.StampTaxRateFor）。与 price_limit 的
  # st / st_before 是同一模式：当前值与历史值分开，否则整段窗口会被同一
  # 个值定价。
  stamp_tax_rate_before: 0.001
  min_commission: 5.0            # 最低佣金 5元
  transfer_fee_rate: 0.00001     # 过户费 0.001%
  price_limit:
    normal: 0.10                 # 主板股票涨跌幅限制 ±10%
    # 主板 ST/*ST 涨跌幅。2026-07-06 起沪深北三所新规由 ±5% 上调至
    # ±10%，与主板其他股票一致。此处的 st 是「当前值」，st_before 是
    # 2026-07-06 之前交易日用的历史值 —— 回测跨该日期时按日切换。
    # 注意：创业板/科创板的风险警示股不受影响，仍按板块 ±20%
    # （由代码按 symbol 判定，不看这两个值）。
    st: 0.10                     # 主板 ST 涨跌幅限制 ±10%（2026-07-06 起）
    st_before: 0.05              # 主板 ST 涨跌幅限制 ±5%（2026-07-06 之前）
    new: 0.20                    # 新股涨跌幅限制 ±20%
  new_stock_days: 60             # 新股判断阈值（已知不准，见 TASKS AUD-07）
  # P2-3 (ODR-026): emergency flatten (kill-switch) bearer token.
  # Empty (default) disables POST /api/execution/emergency-flatten
  # (returns 503). When set, the operator must send the same token
  # in BOTH the `Authorization: Bearer <token>` header AND the
  # JSON body field `confirmation_token` — defence in depth against
  # accidental button presses.
  emergency_token: ""

logging:
  level: "info"
  format: "json"
